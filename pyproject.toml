[build-system]
requires = ["setuptools>=77,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "kipartmanager"
dynamic = ["version"]
description = "Local-first desktop manager for electronic components and KiCad assets"
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
license-files = ["LICENSE", "third_party/licenses/*.txt", "src/kipartmanager/ui/icons/LUCIDE-LICENSE.txt"]
dependencies = ["PySide6>=6.8,<7", "SQLAlchemy>=2,<3", "alembic>=1.14,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "mypy>=1.14,<2", "build>=1,<2"]

[project.scripts]
kipartmanager = "kipartmanager.bootstrap:main"

[tool.setuptools.dynamic]
version = {attr = "kipartmanager.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"kipartmanager.ui" = ["icons/*.svg", "icons/*LICENSE*.txt", "branding/source/*.svg",
    "branding/app/*.ico", "branding/app/*.icns", "branding/app/png/*.png"]
kipartmanager = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --import-mode=importlib"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src"]
extend-exclude = ["build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
strict = true
